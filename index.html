<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paggio</title>
    <meta
      name="description"
      content="App de checklists operacionais para cozinha, bar e salão: execução diária, histórico e relatórios por área."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5C4A3E" />
    <script>
      // aplica o tema salvo antes do primeiro paint, evita flash claro/escuro
      try {
        var t = localStorage.getItem('checklist-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Paggio" />
    <meta property="og:title" content="Checklist — Cozinha, Bar &amp; Salão" />
    <meta
      property="og:description"
      content="App de checklists operacionais para cozinha, bar e salão: execução diária, histórico e relatórios por área."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Rede de segurança: se o app não montar em 8 s (cache antigo apontando para arquivos que não existem mais),
      // limpa o cache do PWA e recarrega uma única vez.
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('paggio_reset')) {
          sessionStorage.setItem('paggio_reset', '1')
          Promise.all([
            navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister() })) }) : 0,
            window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x) })) }) : 0,
          ]).then(function () { location.reload() }, function () { location.reload() })
        }
      }, 8000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
