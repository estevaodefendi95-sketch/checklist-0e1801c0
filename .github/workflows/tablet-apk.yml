name: App do tablet (APK)
on:
  workflow_dispatch:
  push:
    paths: ['tablet-app/**', '.github/workflows/tablet-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p tablet-app assembleRelease --no-daemon
      - name: Publicar APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp tablet-app/app/build/outputs/apk/release/app-release.apk paggio-cardapio.apk
          gh release create "tablet-v${{ github.run_number }}" paggio-cardapio.apk --title "App do tablet v${{ github.run_number }}" --notes "Instale o arquivo paggio-cardapio.apk nos tablets."
